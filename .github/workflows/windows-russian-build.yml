name: Windows Russian build

on:
  push:
    branches:
      - ci/russian-build

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Download build dependencies
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'src_rebuild'
          $deps = Join-Path $source 'dependencies'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null

          function Download-File($uri, $output) {
            & curl.exe --fail --location --retry 5 --retry-delay 5 --retry-all-errors --output $output $uri
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $uri"
            }
          }

          Download-File 'https://github.com/premake/premake-core/releases/download/v5.0.0-beta1/premake-5.0.0-beta1-windows.zip' premake.zip
          Expand-Archive premake.zip -DestinationPath $source

          Download-File 'https://github.com/libsdl-org/SDL/releases/download/release-2.30.2/SDL2-devel-2.30.2-VC.zip' sdl.zip
          Expand-Archive sdl.zip -DestinationPath $deps

          Download-File 'https://github.com/kcat/openal-soft/releases/download/1.23.1/openal-soft-1.23.1-bin.zip' openal.zip
          Expand-Archive openal.zip -DestinationPath $deps

          Download-File 'https://www.ijg.org/files/jpegsr9d.zip' jpeg.zip
          Expand-Archive jpeg.zip -DestinationPath $deps

      - name: Build Release
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'src_rebuild'
          $deps = Join-Path $source 'dependencies'
          $env:SDL2_DIR = Join-Path $deps 'SDL2-2.30.2'
          $env:OPENAL_DIR = Join-Path $deps 'openal-soft-1.23.1-bin'
          $env:JPEG_DIR = Join-Path $deps 'jpeg-9d'
          Rename-Item (Join-Path $env:JPEG_DIR 'jconfig.vc') 'jconfig.h'
          Push-Location $source
          & .\premake5.exe vs2022
          Pop-Location
          msbuild (Join-Path $source 'build\REDRIVER2.sln') /p:Configuration=Release /p:Platform=Win32 /m /nologo

      - name: Create portable package
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'src_rebuild'
          $deps = Join-Path $source 'dependencies'
          $package = Join-Path $env:GITHUB_WORKSPACE 'dist\REDRIVER2-Russian-v8.0-ru2'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item (Join-Path $source 'bin\Release\REDRIVER2.exe') $package
          Copy-Item (Join-Path $deps 'SDL2-2.30.2\lib\x86\SDL2.dll') $package
          Copy-Item (Join-Path $deps 'openal-soft-1.23.1-bin\bin\Win32\soft_oal.dll') (Join-Path $package 'OpenAL32.dll')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'data\*') $package -Recurse
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath "$package.zip"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: REDRIVER2-Russian-v8.0-ru2
          path: dist/REDRIVER2-Russian-v8.0-ru2.zip
          if-no-files-found: error
